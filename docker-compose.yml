services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-demandly}
      POSTGRES_USER: ${POSTGRES_USER:-demandly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-demandly}
    ports:
      - "5432:5432"
    volumes:
      - demandly_postgres_data:/var/lib/postgresql/data
      - ./api/sql:/project-sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER:-demandly} -d $${POSTGRES_DB:-demandly}"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://demandly:demandly@db:5432/demandly}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-replace-this-with-a-long-random-secret}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    volumes:
      - ./api:/app
      - ./datasets:/datasets:ro
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - .:/app
      - demandly_web_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy
    command: npm run dev -- --hostname 0.0.0.0 --port 3000

volumes:
  demandly_postgres_data:
  demandly_web_node_modules:
