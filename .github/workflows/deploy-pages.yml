name: Deploy frontend demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build frontend demo
        env:
          VITE_DEMO_MODE: "true"
          VITE_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - name: Align assets with GitHub Pages project path
        shell: bash
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          if [ -d "dist/client/${REPOSITORY_NAME}/_next" ]; then
            mkdir -p dist/client/_next
            cp -R "dist/client/${REPOSITORY_NAME}/_next/." dist/client/_next/
            rm -rf "dist/client/${REPOSITORY_NAME}"
          fi

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
